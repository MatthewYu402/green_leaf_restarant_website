name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    name: Build and deploy to GoDaddy staging subdomain
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Ensure web.config is present in build output
        run: cp web.config dist/web.config

      - name: Deploy to GoDaddy staging via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.your-domain-placeholder.com
          username: your-ftp-username-placeholder
          password: ${{ secrets.GODADDY_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          # Points at a separate subdomain's document root in Plesk
          # (e.g. staging.your-domain-placeholder.com), NOT httpdocs —
          # keeps this completely separate from the live site.
          server-dir: ./staging.your-domain-placeholder.com/