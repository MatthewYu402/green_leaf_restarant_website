name: Deploy to Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and deploy to GoDaddy staging subdomain
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Ensure web.config is present in build output
        run: cp web.config dist/web.config

      - name: Deploy to GoDaddy staging via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.GODADDY_STAGING_FTP_SERVER }}
          username: ${{ secrets.GODADDY_STAGING_FTP_USERNAME }}
          password: ${{ secrets.GODADDY_STAGING_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          # This should be a separate FTP account scoped to the staging
          # subdomain's own document root (create it in Plesk once the
          # staging.yourdomain.com subdomain exists) — keeps it fully
          # isolated from the production /httpdocs account above.
          server-dir: ./