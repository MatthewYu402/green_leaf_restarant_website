name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and deploy to GoDaddy (httpdocs)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # web.config is required for React Router to work on IIS (Windows
      # Hosting). Keep the real copy in /public so Vite copies it into
      # dist/ automatically during build. This step is a safety net in
      # case it's ever missing from the build output.
      - name: Ensure web.config is present in build output
        run: cp web.config dist/web.config

      - name: Deploy to GoDaddy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.GODADDY_FTP_SERVER }}
          username: ${{ secrets.GODADDY_FTP_USERNAME }}
          password: ${{ secrets.GODADDY_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          # This FTP account's home directory is already /httpdocs, so we
          # upload to its root — NOT ./httpdocs/, which would try to
          # create a nested httpdocs/httpdocs/ folder that doesn't exist.
          server-dir: ./